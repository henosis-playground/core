phf = { version = "0.14", features = ["macros"] }
phf_shared = { version = "0.14", default-features = false, features = ["std"] }
potential_utf = { version = "0.1", default-features = false, features = [
  "alloc",
  "zerovec",
] }
regex-automata = { version = "0.4", default-features = false, features = [
  "dfa-build",
  "meta",
  "std",
  "unicode-perl",
  "unicode-word-boundary",
] }
regex-syntax = { version = "0.8" }
serde = { version = "1", features = ["alloc", "derive"] }
