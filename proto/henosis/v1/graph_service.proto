edition = "2023";

package henosis.v1;

import "henosis/v1/types.proto";

service GraphService {
  // CreateComponent durably creates a component and its initial specification.
  rpc CreateComponent(CreateComponentRequest) returns (CreateComponentResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc CreateGraph(CreateGraphRequest) returns (CreateGraphResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc AddComponents(AddComponentsRequest) returns (AddComponentsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc UpdateComponents(UpdateComponentsRequest) returns (UpdateComponentsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc RemoveComponents(RemoveComponentsRequest) returns (RemoveComponentsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetGraphGeneration(GetGraphGenerationRequest) returns (GetGraphGenerationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RetireGraph(RetireGraphRequest) returns (RetireGraphResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc WatchGraph(WatchGraphRequest) returns (stream WatchGraphResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message CreateComponentRequest {
  bytes component_id = 1;
  NewComponentSpec spec = 2;
}

message CreateComponentResponse {
  Component component = 1;
}

message CreateGraphRequest {
  bytes graph_id = 1;
  repeated bytes component_ids = 2;
  bytes request_id = 3;
}

message CreateGraphResponse {
  Graph graph = 1;
}

message AddComponentsRequest {
  bytes graph_id = 1;
  uint64 expected_generation = 2;
  repeated bytes component_ids = 3;
  bytes request_id = 4;
}

message AddComponentsResponse {
  Graph graph = 1;
}

message ComponentReplacement {
  bytes current_component_id = 1;
  bytes replacement_component_id = 2;
}

message UpdateComponentsRequest {
  bytes graph_id = 1;
  uint64 expected_generation = 2;
  repeated ComponentReplacement replacements = 3;
  bytes request_id = 4;
}

message UpdateComponentsResponse {
  Graph graph = 1;
}

message RemoveComponentsRequest {
  bytes graph_id = 1;
  uint64 expected_generation = 2;
  repeated bytes component_ids = 3;
  bytes request_id = 4;
}

message RemoveComponentsResponse {
  Graph graph = 1;
}

message EditRejectionDetails {
  uint64 current_generation = 1;
  repeated Diagnostic diagnostics = 2;
}

message GetGraphRequest {
  bytes graph_id = 1;
}

message GetGraphResponse {
  GraphState state = 1;
}

message GetGraphGenerationRequest {
  bytes graph_id = 1;
  uint64 generation = 2;
}

message GetGraphGenerationResponse {
  GraphState state = 1;
  repeated Component components = 2;
  GraphLifecycle current_lifecycle = 3;
  uint64 last_published_generation = 4;
}

message RetireGraphRequest {
  bytes graph_id = 1;
  uint64 expected_generation = 2;
  bytes request_id = 3;
}

message RetireGraphResponse {
  bytes graph_id = 1;
  uint64 last_generation = 2;
}

message WatchGraphRequest {
  bytes graph_id = 1;
  uint64 after_sequence = 2;
}

message WatchGraphResponse {
  oneof item {
    WatchGraphSnapshot snapshot = 1;
    WatchGraphChange change = 2;
    WatchGraphVolatileStatus volatile_status = 3;
    WatchGraphProgress progress = 4;
  }
}

message WatchGraphSnapshot {
  uint64 sequence = 1;
  DurableGraphState state = 2;
}

message WatchGraphChange {
  uint64 sequence = 1;
  DurableGraphState state = 2;
}

message WatchGraphVolatileStatus {
  uint64 delivered_sequence = 1;
  repeated SliceReport reports = 2;
}

message WatchGraphProgress {
  uint64 delivered_sequence = 1;
}

message WatchCursorErrorDetails {
  uint64 requested_sequence = 1;
  uint64 earliest_available_sequence = 2;
  uint64 current_sequence = 3;
}
