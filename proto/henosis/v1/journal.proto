edition = "2023";

package henosis.v1;

import "henosis/v1/types.proto";

// Every durable envelope is fail-closed: unknown versions and unknown/unset events stop parsing.

message SpecStreamEnvelope {
  uint32 format_version = 1;
  oneof version {
    SpecStreamRecordV1 v1 = 2;
  }
}

message SpecStreamRecordV1 {
  oneof event {
    ComponentSpecRegisteredV1 component_spec_registered = 1;
  }
}

message ComponentSpecRegisteredV1 {
  bytes hash = 1;
  ComponentSpecRecordV1 spec = 2;
}

message ComponentSpecRecordV1 {
  string name = 1;
  string connector = 2;
  bytes outputs_schema = 3;
  repeated bytes depends_on = 4;
  bytes connector_context = 5;
}

message GraphStreamEnvelope {
  uint32 format_version = 1;
  oneof version {
    GraphStreamRecordV1 v1 = 2;
  }
}

message GraphStreamRecordV1 {
  oneof event {
    GraphCreatedV1 graph_created = 1;
    GenerationAcceptedV1 generation_accepted = 2;
    OutputsPublishedV1 outputs_published = 3;
    GraphRetiredV1 graph_retired = 4;
    SliceReportedV1 slice_reported = 5;
  }
}

message SliceReportedV1 {
  SliceReport report = 1;
  bytes request_id = 2;
  bytes request_fingerprint = 3;
  bytes publication_id = 4;
  bytes publication_fingerprint = 5;
}

message GraphCreatedV1 {
  GraphSnapshotV1 graph = 1;
  bytes request_id = 2;
  bytes request_fingerprint = 3;
}

enum GraphMutationKindV1 {
  GRAPH_MUTATION_KIND_V1_UNSPECIFIED = 0;
  GRAPH_MUTATION_KIND_V1_ADD_COMPONENTS = 1;
  GRAPH_MUTATION_KIND_V1_UPDATE_COMPONENTS = 2;
  GRAPH_MUTATION_KIND_V1_REMOVE_COMPONENTS = 3;
}

message GenerationAcceptedV1 {
  GraphSnapshotV1 graph = 1;
  bytes request_id = 2;
  GraphMutationKindV1 mutation_kind = 3;
  bytes request_fingerprint = 4;
}

message OutputsPublishedV1 {
  uint64 generation = 1;
  string connector = 2;
  repeated ComponentOutputsRecordV1 outputs = 3;
  bytes request_id = 4;
  bytes request_fingerprint = 5;
  bytes publication_id = 6;
  bytes publication_fingerprint = 7;
  uint64 input_sequence = 8;
}

message GraphRetiredV1 {
  bytes graph_id = 1;
  uint64 last_generation = 2;
  bytes request_id = 3;
  bytes request_fingerprint = 4;
}

message GraphSnapshotV1 {
  bytes id = 1;
  uint64 generation = 2;
  repeated bytes component_spec_hashes = 3;
}

message ComponentOutputsRecordV1 {
  bytes component_spec_hash = 1;
  bytes values_json = 2;
}

message RegistryStreamEnvelope {
  uint32 format_version = 1;
  oneof version {
    RegistryStreamRecordV1 v1 = 2;
  }
}

message RegistryStreamRecordV1 {
  oneof event {
    RegistryGraphCreatedV1 graph_created = 1;
    RegistryGraphRetiredV1 graph_retired = 2;
  }
}

message RegistryGraphCreatedV1 {
  bytes graph_id = 1;
  bytes request_id = 2;
}

message RegistryGraphRetiredV1 {
  bytes graph_id = 1;
  bytes request_id = 2;
}
