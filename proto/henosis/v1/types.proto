edition = "2023";

package henosis.v1;

enum OutputAvailability {
  OUTPUT_AVAILABILITY_UNSPECIFIED = 0;
  OUTPUT_AVAILABILITY_STATIC = 1;
  OUTPUT_AVAILABILITY_OBSERVED = 2;
}

message ComponentInput {
  string name = 1;
  string source_component = 2;
  string source_output = 3;
  bool optional = 4;
}

message ComponentOutput {
  string name = 1;
  OutputAvailability availability = 2;
  bool optional = 3;
}

enum GraphSourcePolicy {
  GRAPH_SOURCE_POLICY_UNSPECIFIED = 0;
  GRAPH_SOURCE_POLICY_ACCEPT_LOCAL = 1;
  GRAPH_SOURCE_POLICY_REQUIRE_VCS = 2;
}

message LocalSource {
  string repository = 1;
  string base_revision = 2;
  bool dirty = 3;
}

message VcsSource {
  string repository = 1;
  string revision = 2;
  string reference = 3;
}

message SourceProvenance {
  oneof source {
    LocalSource local = 1;
    VcsSource vcs = 2;
  }
}

message InputBinding {
  string name = 1;
  bytes value_json = 2;
}

message ComponentIntent {
  string name = 1;
  bytes bundle_digest = 2;
  repeated ComponentInput inputs = 3;
  repeated ComponentOutput outputs = 4;
  SourceProvenance source = 5;
  repeated InputBinding input_bindings = 6;
}

message ResourceOutput {
  string name = 1;
  OutputAvailability availability = 2;
}

message Resource {
  string id = 1;
  string path = 2;
  string controller = 3;
  string kind = 4;
  bytes canonical_body_json = 5;
  repeated ResourceOutput outputs = 6;
}

message BlockedOn {
  string component = 1;
  repeated string inputs = 2;
}

message OutputRecord {
  uint64 generation = 1;
  string reference = 2;
  bytes canonical_value_json = 3;
  string source = 4;
}

message Plan {
  uint64 generation = 1;
  bytes digest = 2;
  repeated Resource resources = 3;
  repeated BlockedOn blocked = 4;
}

message GraphStatus {
  reserved 2;

  string graph_id = 1;
  uint64 generation = 3;
  Plan plan = 4;
  repeated OutputRecord outputs = 5;
  repeated string stall_cycle = 6;
  bool retired = 7;
  repeated ComponentIntent components = 8;
  string diagnostic = 9;
  GraphSourcePolicy source_policy = 10;
  repeated ResourceDisposition dispositions = 11;
}

message ControllerSlice {
  string graph_id = 1;
  uint64 generation = 2;
  bytes plan_digest = 3;
  string controller = 4;
  repeated Resource resources = 5;
  repeated string superseded_resource_ids = 6;
}

message ResourceDisposition {
  string resource_id = 1;
  string state = 2;
  string message = 3;
}

message ObservedOutput {
  string resource_id = 1;
  string output = 2;
  bytes canonical_value_json = 3;
}

message ControllerReport {
  string graph_id = 1;
  uint64 generation = 2;
  bytes plan_digest = 3;
  string controller = 4;
  string publication_id = 5;
  repeated ResourceDisposition dispositions = 6;
  repeated ObservedOutput outputs = 7;
}
