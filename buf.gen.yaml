version: v2
clean: true
plugins:
  - local: protoc-gen-buffa
    out: crates/proto/src/generated/buffa
    opt:
      - views=true
      - json=true
  - local: protoc-gen-buffa-packaging
    out: crates/proto/src/generated/buffa
    strategy: all
  - local: protoc-gen-connect-rust
    out: crates/proto/src/generated/connect
    opt:
      - buffa_module=crate::proto
  - local: protoc-gen-buffa-packaging
    out: crates/proto/src/generated/connect
    strategy: all
    opt:
      - filter=services
